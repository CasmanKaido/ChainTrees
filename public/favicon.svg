<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="treeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Tree trunk -->
  <rect x="45" y="60" width="10" height="25" fill="#8b4513" rx="2"/>
  
  <!-- Tree foliage -->
  <circle cx="50" cy="40" r="25" fill="url(#treeGradient)"/>
  <circle cx="35" cy="50" r="18" fill="url(#treeGradient)"/>
  <circle cx="65" cy="50" r="18" fill="url(#treeGradient)"/>
  <circle cx="50" cy="55" r="20" fill="url(#treeGradient)"/>
</svg>
